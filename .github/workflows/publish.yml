name: Release & Publish

on:
  release:
    types: [created]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Use Node.js 24.18.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Install dependencies
        run: npm install --global npm@12.0.2 && npm ci --ignore-scripts

      - name: Linting
        run: npm run lint

      - name: Type Check
        run: npm run type-check

      - name: Unit Testing
        run: npm run test:coverage

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ !contains(github.head_ref, 'renovate/') }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Use Node.js 24.18.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Install dependencies
        run: npm install --global npm@12.0.2 && npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - id: publish
        uses: JS-DevTools/npm-publish@d87e0b8f92752072e923c67318e1b358714eb2ae # v4.1.5
        with:
          token: ${{ secrets.NPM_TOKEN }}
          check-version: true

      - if: steps.publish.outputs.type != 'none' || steps.publish.outputs.version >= steps.publish.outputs.old-version
        run: |
          echo "Version changed: ${{ steps.publish.outputs.old-version }} => ${{ steps.publish.outputs.version }}"
